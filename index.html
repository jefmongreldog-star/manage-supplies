<script>
  // 開発者ツールが使えない環境でも原因が分かるように、
  // 画面上に直接エラーを表示する
  function showFatalError(message) {
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#A6362C;white-space:pre-wrap;">' +
        '読み込みに失敗しました。以下のエラー内容を開発者に伝えてください。\n\n' +
        message +
        '</div>';
    }
  }
  window.addEventListener("error", function (e) {
    showFatalError((e.message || "unknown error") + "\n(" + (e.filename || "") + ":" + (e.lineno || "") + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = reason && reason.message ? reason.message : String(reason);
    var code = reason && reason.code ? " [" + reason.code + "]" : "";
    showFatalError(msg + code);
  });
</script>

async function authedFetch(path, options) {
  const user = auth.currentUser;
  if (!user) throw new Error("認証されていません");
  const token = await user.getIdToken();
  const sep = path.includes("?") ? "&" : "?";
  const res = await fetch(DB_URL + path + sep + "auth=" + token, options);
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error("HTTP " + res.status + (text ? ": " + text : ""));
  }
  return res;
}
